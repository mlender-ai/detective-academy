<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>탐정학원 · A안과 B안 나란히 보기</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #1d1a20; color: #efe6d2;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    font-size: 15px; line-height: 1.5; letter-spacing: -0.01em; word-break: keep-all;
    display: flex; flex-direction: column;
  }
  header { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding: 14px 22px 10px; }
  h1 { margin: 0; font-size: 19px; letter-spacing: -0.02em; }
  header p { margin: 0; color: #b9ad99; font-size: 13.5px; flex: 1 1 320px; }
  .sizes, .scenes { display: flex; flex-wrap: wrap; gap: 6px; }
  .scenes { flex: 1 1 100%; align-items: center; }
  .scenes span { font-size: 13.5px; color: #b9ad99; margin-right: 4px; }
  .sizes button, .scenes button {
    font: inherit; font-size: 13.5px; font-weight: 600; color: #efe6d2; background: #332d38; border: 1px solid #5a5063;
    border-radius: 6px; padding: 7px 12px; cursor: pointer;
  }
  .sizes button[aria-pressed="true"], .scenes button[aria-pressed="true"] { background: #7d2c36; border-color: #a8424d; }
  .sizes button:focus-visible, .scenes button:focus-visible { outline: 2px solid #efe6d2; outline-offset: 2px; }
  main { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: flex-start; gap: 40px; padding: 6px 22px 18px; overflow: auto; }
  figure { margin: 0; display: grid; gap: 10px; justify-items: center; }
  figcaption { font-size: 15px; font-weight: 700; }
  figcaption small { display: block; font-size: 12.5px; font-weight: 500; color: #b9ad99; text-align: center; }
  .frame { position: relative; overflow: hidden; border-radius: 16px; box-shadow: 0 0 0 1px #5a5063, 0 24px 50px -24px #000; background: #000; }
  iframe { display: block; border: 0; transform-origin: 0 0; }
</style>
</head>
<body>
<header>
  <h1>탐정학원 · A안과 B안 나란히 보기</h1>
  <p>같은 게임을 두 가지 화풍으로 띄웠습니다. 두 화면은 진행 상태를 따로 저장하므로 각각 눌러 볼 수 있습니다. 아래 단추를 누르면 두 화면이 같은 장면으로 바뀝니다.</p>
  <div class="sizes" role="group" aria-label="화면 크기">
    <button type="button" data-w="390" data-h="844" aria-pressed="true">390×844</button>
    <button type="button" data-w="390" data-h="664" aria-pressed="false">390×664 (주소창 보이는 사파리)</button>
    <button type="button" data-w="375" data-h="812" aria-pressed="false">375×812</button>
  </div>
  <div class="scenes" role="group" aria-label="장면 바로 가기">
    <span>장면</span>
    <button type="button" data-preset="first-run" data-route="">입학</button>
    <button type="button" data-preset="daily-unsolved" data-route="" aria-pressed="true">학원 복도</button>
    <button type="button" data-preset="daily-unsolved" data-route="#/daily">암호 해독</button>
    <button type="button" data-preset="daily-solved" data-route="#/practice">연습실</button>
    <button type="button" data-preset="daily-solved" data-route="#/practice/practice-truth-001">진술 추리</button>
    <button type="button" data-preset="exam-ready" data-route="#/exam">승급 시험</button>
    <button type="button" data-preset="promoted" data-route="#/exam">합격 기록</button>
    <button type="button" data-preset="promoted" data-route="#/profile">탐정 신분증</button>
  </div>
</header>
<main>
  <figure>
    <figcaption>A안 · 수채 드로잉<small>펜선과 덜 채운 수채화</small></figcaption>
    <div class="frame"><iframe title="A안 수채 드로잉" src="./?art=ink&save=a&demo=1&preset=daily-unsolved"></iframe></div>
  </figure>
  <figure>
    <figcaption>B안 · 픽셀 아트<small>닌텐도 DS · 90년대 어드벤처</small></figcaption>
    <div class="frame"><iframe title="B안 픽셀 아트" src="./?art=pixel&save=b&demo=1&preset=daily-unsolved"></iframe></div>
  </figure>
</main>
<script>
  let size = { w: 390, h: 844 };
  const frames = [...document.querySelectorAll(".frame")];
  const main = document.querySelector("main");
  function fit() {
    // 창 높이에 맞춰 두 화면을 같은 비율로 줄인다
    const room = main.clientHeight - 80;
    const scale = Math.min(1, Math.max(0.5, room / size.h));
    for (const frame of frames) {
      const iframe = frame.firstElementChild;
      iframe.style.width = size.w + "px";
      iframe.style.height = size.h + "px";
      iframe.style.transform = "scale(" + scale + ")";
      frame.style.width = Math.round(size.w * scale) + "px";
      frame.style.height = Math.round(size.h * scale) + "px";
    }
  }
  for (const button of document.querySelectorAll(".sizes button")) {
    button.addEventListener("click", () => {
      size = { w: Number(button.dataset.w), h: Number(button.dataset.h) };
      document.querySelectorAll(".sizes button").forEach((b) => b.setAttribute("aria-pressed", String(b === button)));
      fit();
    });
  }
  // 장면 바로 가기: 두 화면을 같은 진행 상태·같은 화면으로 다시 연다
  const ARTS = [["ink", "a"], ["pixel", "b"]];
  for (const button of document.querySelectorAll(".scenes button")) {
    button.addEventListener("click", () => {
      document.querySelectorAll(".scenes button").forEach((b) => b.setAttribute("aria-pressed", String(b === button)));
      frames.forEach((frame, i) => {
        const [art, save] = ARTS[i];
        frame.firstElementChild.src =
          "./?art=" + art + "&save=" + save + "&demo=1&preset=" + button.dataset.preset + "&apply=1&t=" + Date.now() + button.dataset.route;
      });
    });
  }
  addEventListener("resize", fit);
  fit();
</script>
</body>
</html>
