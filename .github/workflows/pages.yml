# main 에 올라오면 단위 테스트를 돌리고 빌드해서 깃허브 페이지로 배포한다.
# 주소: https://mlender-ai.github.io/detective-academy/
name: 깃허브 페이지 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm ci 는 리눅스에서 잠금 파일에 없는 선택 패키지(@emnapi, wasm 대체 빌드용)를 이유로 멈춘다.
      # 맥에서 만든 잠금 파일의 알려진 문제라, 잠금 파일의 버전은 그대로 따르되 빠진 것만 채우는 npm install 을 쓴다.
      - name: 패키지 설치
        run: npm install --no-audit --no-fund
      - name: 단위 테스트 (정답 유일성 포함)
        run: npm test
      - name: 빌드 (타입 검사 포함)
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
