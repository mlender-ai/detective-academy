# 탐정학원 프로젝트 설정.
# Claude Code Game Studios(CCGS) 1.3.0 의 project.yaml 형식(schema_version 1)을 따른다.
# CCGS 의 훅·스킬·설정은 설치하지 않았다(docs/studio/README.md 의 "들인 것과 들이지 않은 것").
# 이 파일은 (1) 스튜디오 운영 방식의 기준값이고 (2) 나중에 CCGS 의 스킬을 골라 들일 때 같은 값을 읽게 하려는 것이다.

schema_version: 1

project:
  name: "탐정학원 (DETECTIVE ACADEMY)"
  genre: "미스터리 추리 퍼즐"
  stage: Production
  kind: game

modes:
  rigor: minimal             # 문서와 절차는 가장 가볍게. 아래 review_mode 와 qa.level 은 rigor 가 정해 주는 값을 일부러 올린 것이다.
  review_mode: lean          # minimal 의 기본은 solo(검수 없음)다. 게임을 바꾼 작업은 독립 검수를 받는다.
  automation: guided         # 승인된 범위 안에서는 묻지 않고 구현·테스트하고, 큰 결정만 묻는다.
  automation_always_ask:     # 항상 사용자에게 묻는 것
    - scope_changes          # 제품 방향과 범위
    - file_deletions         # 화면·안·파일 걷어내기 (먼저 docs/archive 에 보관)
    - schema_changes         # 저장 데이터 형식, 이 파일
    - architecture_decisions # 엔진·렌더러·구조 변경
    - version_bumps          # 의존성의 주 버전
    - external_calls         # 외부 서비스, 큰 내려받기

qa:
  level: standard            # minimal 의 기본은 "논리 변경에 테스트 없음"이다. 정답 유일성·보상·시험 정책·모바일 UI 테스트는 생략하지 않는다.

testing:
  framework: "vitest + playwright"
  strict:
    logic: true
    integration: true
    visual: true
    ui: true
    config: true             # 수치(보상, 시험 규칙)만 바꿔도 테스트가 막는다

# docs.density 는 rigor(minimal → terse)를 따른다.
# 새 GDD·스프린트 문서·회의록을 만들지 않고 CLAUDE.md · PRODUCT.md · DESIGN.md · lab/README.md 를 고쳐 쓴다.

engine:
  name: "Web"
  language: "TypeScript"
  version: "React 19 · Vite 8 · Canvas 2D"
  code_root: "src"
  test_root: "src/tests"     # Vitest. Playwright 는 e2e/ 에 있다

commands:
  run: "npm run dev"         # http://localhost:5183
  build: "npm run build"
  test: "npm test"
  smoke: "npm run typecheck && npm test"
  verify: "npm run verify"   # 타입 검사 + Vitest + Playwright(빌드본)

platform:
  multiplayer: false
  online: false
  targets: [Web, Mobile]
  primary_input: "Touch"
  touch_support: "Full"

performance:
  target_framerate: 60
  frame_budget_ms: 16.67
  enforce: warn

updates:
  check: false               # CCGS 의 새 버전 확인(세션을 시작할 때 GitHub 에 접속한다)을 쓰지 않는다

features:
  session_state: off         # production/session-state 를 만들지 않는다. 진행 상태는 CLAUDE.md 와 lab/README.md 에 적는다
